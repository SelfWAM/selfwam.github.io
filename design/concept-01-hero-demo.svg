<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280">
  <rect width="1440" height="1280" fill="#fdfaf4"/>
  <style>
    text{font-family:'Roboto Mono',monospace;fill:#171717}.muted{fill:#6b6b66}.small{font-size:14px}.body{font-size:17px}.rule{stroke:#1a1a1a;stroke-opacity:.18}.button{fill:none;stroke:#1a1a1a;stroke-opacity:.24}
  </style>
  <g transform="translate(64 36)">
    <text font-size="15" font-weight="700">SelfWAM / RESEARCH</text>
    <text x="1010" font-size="14">OVERVIEW</text><text x="1110" font-size="14">RESULTS</text><text x="1200" font-size="14">METHOD</text>
    <line x2="1312" y1="34" y2="34" class="rule"/>
  </g>
  <g text-anchor="middle">
    <text x="720" y="170" font-size="68" font-weight="700">SelfWAM</text>
    <text x="720" y="225" font-size="28">A Self-Grounded Unified</text>
    <text x="720" y="263" font-size="28">World Action Model for Fast Robot Control</text>
    <text x="720" y="318" class="muted body">Anonymous research project · World Action Models</text>
    <g transform="translate(534 352)">
      <rect width="112" height="42" rx="21" class="button"/><text x="56" y="27" font-size="15">Results</text>
      <rect x="126" width="112" height="42" rx="21" class="button"/><text x="182" y="27" font-size="15">GitHub</text>
      <rect x="252" width="128" height="42" rx="21" class="button"/><text x="316" y="27" font-size="15">BibTeX</text>
    </g>
  </g>
  <g transform="translate(120 466)">
    <text font-size="13" font-weight="700" fill="#3d6b35">ACTION-SENSITIVE FUTURES</text>
    <text y="55" font-size="38" font-weight="600">Change the action. Change the future.</text>
    <text y="94" class="muted body">The same observation is rolled out under four action scales.</text>
    <g transform="translate(0 136)">
      <rect width="1200" height="496" rx="14" fill="#f1f2f2" stroke="#1a1a1a" stroke-opacity=".14"/>
      <image href="../static/assets/posters/beat_block_hammer_clean_seed4300000_step313.jpg" x="1" y="48" width="1198" height="495" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip)"/>
      <clipPath id="clip"><rect x="1" y="48" width="1198" height="447" rx="0"/></clipPath>
      <g text-anchor="middle" font-size="15" font-weight="600">
        <text x="150" y="30">λ = 0 · HOLD</text><text x="450" y="30">λ = 0.25 · SLOW</text>
        <text x="750" y="30">λ = 0.75 · MEDIUM</text><text x="1050" y="30">λ = 1.0 · EXPERT</text>
      </g>
    </g>
    <g transform="translate(0 658)">
      <rect width="270" height="42" rx="21" fill="#171717"/><text x="135" y="27" fill="#fdfaf4" text-anchor="middle" font-size="14">Beat block with hammer</text>
      <text x="1200" y="27" text-anchor="end" class="muted small">Ground truth / Ours · 35 denoising steps</text>
